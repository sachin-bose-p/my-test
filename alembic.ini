[alembic]
# Commented out duplicate section for script_location
# script_location is already defined, removing duplicate
sqlalchemy.url = %sqlalchemy.url%
script_location = migrations
# Removed duplicate script_location entry
[loggers]
keys = root,sqlalchemy
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_sqlalchemy]
level = INFO
handlers = console
qualname = sqlalchemy.engine
[handler_console]
class = StreamHandler
args = []
level = DEBUG
formatter = generic
[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}body{background:linear-gradient(#0000008c,#0000008c),url(https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80) 50%/cover no-repeat;justify-content:center;align-items:center;min-height:100vh;padding:20px;display:flex}.login-container{-webkit-backdrop-filter:blur(16px);color:#fff;background:#ffffff1f;border:1px solid #ffffff40;border-radius:16px;width:100%;max-width:420px;padding:40px 32px;box-shadow:0 20px 40px #0000004d}.login-header{text-align:center;margin-bottom:28px}.login-header h2{letter-spacing:-.5px;margin-bottom:8px;font-size:28px;font-weight:700}.login-header p{color:#e0e0e0;font-size:14px}.input-group{margin-bottom:20px}.input-group label{color:#f1f1f1;margin-bottom:6px;font-size:13px;font-weight:500;display:block}.input-group input{color:#fff;background:#ffffff14;border:1px solid #ffffff4d;border-radius:8px;outline:none;width:100%;padding:12px 16px;font-size:14px;transition:all .2s}.input-group input::placeholder{color:#bdbdbd}.input-group input:focus{background:#ffffff26;border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f64d}.options-row{justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px;display:flex}.remember-me{cursor:pointer;-webkit-user-select:none;user-select:none;align-items:center;gap:8px;display:flex}.remember-me input{accent-color:#3b82f6;cursor:pointer;width:15px;height:15px}.forgot-link,.signup-link{color:#93c5fd;font-weight:500;text-decoration:none;transition:color .2s}.forgot-link:hover,.signup-link:hover{color:#fff;text-decoration:underline}.btn-login{color:#fff;cursor:pointer;background:#2563eb;border:none;border-radius:8px;width:100%;padding:13px;font-size:15px;font-weight:600;transition:background .2s,transform .1s}.btn-login:hover{background:#1d4ed8}.btn-login:active{transform:scale(.99)}.signup-text{text-align:center;color:#e0e0e0;margin-top:24px;font-size:14px}</style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Enter your details to sign in</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="input-group">
        <label for="username">Username or Email</label>
        <input 
          type="text" 
          id="username" 
          placeholder="e.g. user@example.com" 
          required 
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          placeholder="Enter your password" 
          required 
        />
      </div>

      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" id="remember" />
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">Sign In</button>

      <div class="signup-text">
        Don't have an account? <a href="#" class="signup-link">Create account</a>
      </div>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Save input temporarily for the dashboard
      sessionStorage.setItem('loginUser', username);
      sessionStorage.setItem('loginPass', password);

      // Redirect to dashboard
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>

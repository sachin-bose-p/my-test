<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smape Profile</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-color);
        }

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .username {
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--text-primary);
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease-in-out;
        }

        .link-btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 28px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <!-- Replace with your image URL -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300&h=300&fit=crop&crop=faces" alt="Profile Avatar" class="avatar">
        </div>

        <h1 class="name">Jane Doe</h1>
        <p class="username">@janedoe</p>
        <p class="bio">Digital creator, developer, and tech enthusiast. Building things for the web and sharing my journey along the way.</p>

        <div class="links-list">
            <a href="https://github.com" target="_blank" class="link-btn">GitHub</a>
            <a href="https://twitter.com" target="_blank" class="link-btn">Twitter / X</a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn</a>
            <a href="https://yourwebsite.com" target="_blank" class="link-btn">Personal Website</a>
        </div>

        <div class="footer">
            Powered by Smape
        </div>
    </div>

</body>
</html>
